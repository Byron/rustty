[package]
name = "rustty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Public Rustty API, configuration, and terminal sessions."

[features]
default = []
sessions = ["dep:portable-pty", "dep:libc", "dep:serde_json"]

[dependencies]
rustty-parser.workspace = true
rustty-vt.workspace = true
portable-pty = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }
