[package]
name = "rustty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Public Rustty API, configuration, and terminal sessions."

[features]
default = []
sessions = ["dep:portable-pty", "dep:libc", "dep:serde_json", "dep:serde", "dep:tmuxx-runtime", "dep:tmuxx-terminal", "dep:tmuxx-protocol", "dep:tmuxx-layout", "dep:tmuxx-client", "dep:tmuxx-command", "dep:getrandom"]

[dependencies]
rustty-parser.workspace = true
rustty-vt.workspace = true
portable-pty = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

serde = { workspace = true, optional = true }
tmuxx-terminal = { workspace = true, optional = true }
tmuxx-runtime = { workspace = true, optional = true }
tmuxx-protocol = { workspace = true, optional = true }
tmuxx-layout = { workspace = true, optional = true }
tmuxx-client = { workspace = true, optional = true }
tmuxx-command = { workspace = true, optional = true }
getrandom = { version = "0.3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }
