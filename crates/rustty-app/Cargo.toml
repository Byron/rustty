[package]
name = "rustty-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The Rustty desktop terminal application."

[[bin]]
name = "rustty"
path = "src/main.rs"

[[test]]
name = "native_panel"
path = "tests/native_panel.rs"
harness = false

[[test]]
name = "native_quick_animation"
path = "tests/native_quick_animation.rs"
harness = false

[[test]]
name = "native_global_hotkeys"
path = "tests/native_global_hotkeys.rs"
harness = false

[[test]]
name = "native_text_input"
path = "tests/native_text_input.rs"
harness = false

[[test]]
name = "windows_platform"
path = "tests/windows_platform.rs"
harness = false

[dependencies]
rustty = { workspace = true, features = ["sessions"] }
rustty-font.workspace = true
rustty-render.workspace = true
rustty-render-wgpu.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
winit.workspace = true
wgpu.workspace = true
serde.workspace = true
serde_json.workspace = true
pollster = "0.4"
base64.workspace = true
png.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-user-notifications.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
block2 = "0.6"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.19"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom", "Foundation", "UI_Notifications", "UI_ViewManagement",
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Console", "Win32_System_DataExchange",
    "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole",
    "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WinRT", "Win32_System_ProcessStatus",
    "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Notifications",
    "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
