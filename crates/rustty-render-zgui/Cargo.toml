[package]
name = "rustty-render-zgui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Retained panel composition for Rustty using zgui."

[dependencies]
rustty-render.workspace = true
rustty-render-wgpu = { workspace = true, features = ["zgui"] }
egui.workspace = true
winit.workspace = true
bytemuck = { version = "1.25", features = ["derive"] }
zgui-render-wgpu = { git = "https://github.com/Byron/zgui", rev = "dfb3ab5cc0a5faf7b9ee252a73edb1a17102ca38" }
zgui-render = { git = "https://github.com/Byron/zgui", rev = "dfb3ab5cc0a5faf7b9ee252a73edb1a17102ca38" }
zgui-scene = { git = "https://github.com/Byron/zgui", rev = "dfb3ab5cc0a5faf7b9ee252a73edb1a17102ca38" }
zgui-bits = { git = "https://github.com/Byron/zgui", rev = "dfb3ab5cc0a5faf7b9ee252a73edb1a17102ca38" }
zgui-geom = { git = "https://github.com/Byron/zgui", rev = "dfb3ab5cc0a5faf7b9ee252a73edb1a17102ca38" }
