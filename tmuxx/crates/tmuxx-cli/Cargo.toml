[package]
name = "tmuxx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "ISC"

[[bin]]
name = "tmuxx"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde_json.workspace = true
libc.workspace = true
tmuxx-runtime = { path = "../tmuxx-runtime" }
tmuxx-protocol = { path = "../tmuxx-protocol", features = ["native"] }
tmuxx-command = { path = "../tmuxx-command" }

[target.'cfg(unix)'.dependencies]
tmuxx-unix-ipc = { path = "../tmuxx-unix-ipc" }

[dev-dependencies]
tmuxx-core = { path = "../tmuxx-core" }
base64 = "0.22"
portable-pty.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

