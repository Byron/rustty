[package]
name = "tmuxx-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "ISC"

[dependencies]
tmuxx-core = { path = "../tmuxx-core" }
tmuxx-command = { path = "../tmuxx-command" }
tmuxx-config = { path = "../tmuxx-config" }
tmuxx-format = { path = "../tmuxx-format" }
tmuxx-protocol = { path = "../tmuxx-protocol", features = ["native"] }
portable-pty.workspace = true
serde_json.workspace = true
serde.workspace = true
tmuxx-terminal = { path = "../tmuxx-terminal" }
libc.workspace = true

[target.'cfg(unix)'.dependencies]
tmuxx-unix-ipc = { path = "../tmuxx-unix-ipc" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }

