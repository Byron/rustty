platforms = ["win32"]
profiles = ["windows"]
args = ["+1.95.0", "test", "--locked", "--offline", "-p", "rustty-app", "--lib", "tmuxx_launcher::tests::concurrent_empty_owner_bootstrap_and_reuse_keep_one_session_and_process", "--", "--exact"]
timeout = 180
env = {}

[[suites.assertions]]
id = "windows.rustty-concurrent-persistent-bootstrap"
tests = ["tmuxx_launcher::tests::concurrent_empty_owner_bootstrap_and_reuse_keep_one_session_and_process"]
description = "Concurrent native persistent startup against an empty owner creates exactly one session, pane and process. Subsequent connect_or_start reuses that owner, and bounded shutdown proves the original process exits. Descendant ownership has separate required suites."

