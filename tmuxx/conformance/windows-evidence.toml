[[suites.assertions]]
id = "windows.pipe-fragmentation-identity-and-bounds"
tests = ["windows::tests::names_preserve_unicode_and_metacharacters_without_aliases", "windows::tests::pipe_fragments_are_binary_exact_and_tokens_match", "windows::tests::absent_instance_does_not_launch_an_owner", "windows::tests::cancelling_idle_reads_and_slow_writes_is_bounded", "windows::tests::busy_admission_waits_for_the_same_listener_and_times_out_without_startup", "windows::tests::rapid_concurrent_admissions_preserve_each_binary_stream"]
description = "Real local named pipes preserve binary fragments, verify matching account tokens, reject absent owners and cancel idle reads/slow writes. Busy admission waits only before handshake, has a finite deadline and preserves 32 concurrent binary streams without starting another owner. Instance names encode Unicode and shell metacharacters injectively. Separate cross-logon and unauthorized-token evidence is still required."

[[suites.assertions]]
id = "windows.atomic-spawn-job-ownership"
tests = ["windows_job::tests::invalid_executable_returns_error_and_restores_thread_error_mode", "windows_job::tests::abrupt_owner_exit_cleans_process_created_before_registration", "windows_job::tests::cancellation_kills_descendants_and_preserves_unrelated_process", "windows_job::tests::shell_forms_preserve_unicode_metacharacters_binary_output_and_environment", "windows_job::tests::owned_stdio_preserves_binary_streams_and_cleans_during_spawn", "windows_job::conpty_tests::first_child_phase_and_descendants_are_owned_before_runtime_registration", "windows_job::conpty_tests::failed_spawn_reclaims_conpty_host_and_allows_fresh_spawn"]
description = "Actual CreateProcessW job-list assignment owns descendants during startup and kills only owned processes. The pinned production ConPTY path checks its innermost kill-on-close job in the pane program's first test phase, creates foreground/background descendants without runtime registration, and proves their held handles and OpenConsole exit on owner-only death before outer cleanup. Actual invalid-PE CreateProcess failures preserve handle/process counts, reclaim their ConPTY host and allow a fresh spawn. cmd.exe/PowerShell shell jobs and binary-stdio helpers preserve Unicode/metacharacters, native environment names, all byte values and separate diagnostics."

[[suites.assertions]]
id = "windows.native-defaults-and-process-metadata"
tests = ["defaults::windows_tests::account_profile_shell_and_editor_defaults_use_native_identity", "names::windows_tests::root_handle_metadata_tracks_native_cd_and_never_reuses_an_exited_pid", "scheduler::windows_job_directory_tests::scheduled_shell_falls_back_to_home_then_volume_root_with_matching_pwd"]
description = "Windows account/profile/shell/editor defaults and retained-process metadata use native identity and exact Unicode paths. The documented root-process policy avoids pretending ConPTY exposes a POSIX foreground group."

[[suites.assertions]]
id = "windows.conpty-resource-hashes-and-negative-initialization"
tests = ["windows_conpty::tests::conpty_sha256_uses_native_sha256", "windows_conpty::tests::incompatible_conpty_resources_fail_before_system_initialization", "windows_conpty::tests::missing_conpty_resources_fail_before_system_initialization"]
description = "The shared initializer validates pinned resource identity, including same-length corruption, before API selection and rejects missing/incompatible resources. Separate shipped-executable and real ConPTY evidence is required."

[[suites.assertions]]
id = "windows.shared-terminal-snapshot-control-contracts"
tests = ["snapshots::image_changes_refresh_native_graphs_including_other_pane_evictions", "snapshots::image_snapshots_stream_atomically_and_rejection_preserves_the_live_owner", "snapshots::native_byte_backlog_disconnects_before_record_capacity", "snapshots::one_large_snapshot_does_not_consume_the_slow_output_budget", "control::tests::pause_follows_reply_and_resume_does_not_replay_suppressed_output", "control::tests::subscriptions_report_initial_changes_and_each_link_index", "process::tests::stdin_chunks_enforce_ownership_and_resume_only_after_eof", "reports::tests::reports_follow_c_osc_framing_and_x11_channel_conversion", "view_state::tests::multiple_views_aggregate_focus_and_prefer_focused_theme"]
description = "Shared control, snapshot/image, incremental stdin, terminal report and view-focus contracts execute natively on Windows. These backend tests do not substitute for desktop view evidence."

