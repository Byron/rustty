[[suites.assertions]]
id = "config.c-source-stdin-files-flags-and-async-preparation"
tests = ["source_stdin_preserves_complete_files_flags_groups_and_preparation_matrix"]
description = "All thirteen source/stdin/file/flag/error/group/repeated-input cases run with the real C CLI and native Windows CLI/pipe owner. Only the five known canonical source filename prefixes are projected explicitly; command, line, error and state bytes remain exact. Held-input clients on each platform prepare the prefix once before EOF, allow another client to change the environment, then preserve source/suffix context without replay. Unix IPC pairings remain separately required on their platforms."

