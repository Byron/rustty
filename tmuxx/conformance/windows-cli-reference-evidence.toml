[[suites.assertions]]
id = "cli.c-selector-byte-forwarding"
tests = ["malformed_selectors_preserve_graph_and_binary_bridge_bytes", "malformed_selectors_have_exact_control_errors_and_leave_attachment_usable"]
description = "The complete selector registry matrix compares actual C command/control behavior with the native Windows binary stdio bridge and native CLI control. Malformed byte selectors, valid U+FFFD names, CANFAIL, repeated-flag precedence, destructive graph probes, arbitrary literal/file bytes, prior/following commands and inactive branches remain exact. Windows argv never aliases unrepresentable bytes through replacement characters."

[[suites.assertions]]
id = "difference.native-selector-utf8-rejection"
tests = ["malformed_selectors_preserve_graph_and_binary_bridge_bytes", "malformed_selectors_have_exact_control_errors_and_leave_attachment_usable"]
description = "Every original target/source/client selector rejection has exact separate C and native diagnostics. Binary bridge requests and octal-escaped native control retain raw input identity while rejected operations preserve graph names and keep the attachment usable."
