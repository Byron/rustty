[[differences]]
id = "bounded-native-snapshot"
profiles = ["app-owned", "standalone", "native-views"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["image.c", "tmuxx/crates/tmuxx-protocol/src/native/snapshot.rs", "tmuxx/crates/tmuxx-runtime/src/lib.rs", "tmuxx/NATIVE-SNAPSHOTS.md"]
reproducer = "Request a native snapshot with a configured sixteen-byte total cap, then repeat under the ordinary budget; separately restore a four-byte image under a three-byte receiving image cap."
c_result = "C has no native snapshot API. Its retained image/source behavior is checked separately by the image quota and pixel differential suites."
rust_result = "The snapshot abort and image restore error are explicit, retain the prior receiving state and live owner PID/images, and permit a larger-budget retry. Default stream cap8GiB supports default1GiB global image data across both screen views."
reason = "Bound untrusted snapshot disk/allocation growth and avoid installing partial graphs; stream large valid snapshots instead of treating them as slow output."
wire_invariants = "Existing Unix IPC/control framing is unchanged. Additive version1 hello negotiation enables native snapshot chunks; old numeric image arrays still decode."
test = "cargo test -p tmuxx-runtime --test host native_socket_streams_snapshots_and_cap_rejection_keeps_the_process"
review_when = "Each native schema, image quota or terminal checkpoint change; review aggregate graph/image accounting before lifting the limit."

