[[differences]]
id = "owned-pty-session-cleanup"
profiles = ["app-owned", "standalone"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["server-fn.c", "window.c", "tmuxx/crates/tmuxx-runtime/src/process.rs", "tmuxx/crates/tmuxx-runtime/src/lib.rs", "tmuxx/crates/tmuxx-runtime/src/linux_watchdog.rs"]
reproducer = "PTY leader forks a child that changes process group, ignores SIGHUP, retains the slave and outlives its leader; then shut down the owner. Repeat with the child calling setsid instead."
c_result = "Current C and C3.7c leave both background-group and setsid descendants alive after owner shutdown."
rust_result = "Shutdown terminates every group still belonging to the owned PTY OS session on macOS/Linux, while an independent host remains alive. Linux also uses a spawn broker, retained leader identity and pidfds for abrupt owner death, including exited leaders and orphaned descendants. A deliberately detached setsid descendant survives there, matching both C references. Native Windows Job Objects terminate both CREATE_NEW_PROCESS_GROUP and DETACHED_PROCESS descendants after their leader exits, while a separately owned process remains alive."
reason = "An app-owned host must reclaim its ordinary PTY jobs and I/O workers even when the leader exits first. Unix uses its tested OS-session boundary; Windows uses stronger explicit Job containment and independently verifies both native console-attachment categories against the C observations."
wire_invariants = "No protocol framing changes; pipe output still drains before ordinary process removal."
test = "cargo test -p tmuxx-runtime --test host pty_descendant_cleanup_difference_matches_c -- --ignored"
review_when = "Every C baseline or PTY backend change; stronger containment of newly daemonized sessions requires an explicit OS-specific ownership mechanism."

[[differences]]
