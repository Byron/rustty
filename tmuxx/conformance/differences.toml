rust_result = "The extra connection closes before identification; releasing one existing connection allows a new client. Owner shutdown closes idle clients."
reason = "Bound worker threads and descriptor ownership before accepting untrusted handshake input."
wire_invariants = "Admitted peers use the unchanged identification and command/control protocols."
test = "cargo test -p tmuxx-runtime --test host socket_clients_are_bounded_and_shutdown_closes_idle_peers"
review_when = "Review admission with an asynchronous transport implementation or supported host-scale change."

