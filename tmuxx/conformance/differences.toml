review_when = "Every modifier grammar or recursive-expansion baseline update."

[[differences]]
id = "buffer-invalid-name-diagnostic"
profiles = ["command-control", "app-owned", "standalone", "unix-ipc"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["paste.c", "tmux.c", "utf8.c", "tmuxx/crates/tmuxx-core/src/buffers.rs", "tmuxx/crates/tmuxx-core/src/lib.rs"]
reproducer = "Create or rename a buffer with CR/ESC/DEL or malformed UTF8 in its name, capture/load nonempty data with that name, or use raw0xff to show/delete/rename/paste/save while a valid U+FFFD named buffer exists."
c_result = "Rejects the operation and prints the original invalid name bytes in the diagnostic. Empty capture/load data bypasses validation of an unused name."
rust_result = "Rejects without buffer mutation or clipboard effects; invalid creation names and malformed-UTF8 lookup bytes use escaped ASCII diagnostics. Empty data remains a no-op before name validation and automatic-ID allocation."
reason = "Preserve byte identity and avoid injecting raw control records or replacing malformed UTF8 with a different valid buffer name merely to represent diagnostics as a Rust String."
wire_invariants = "Supported valid UTF8 names preserve C cleaning, raw lookup and notification ordering. Invalid-name errors retain existing command/control framing and never store a lossy or partially validated name. C raw and Rust escaped diagnostic bytes are asserted separately without transcript normalization."
test = "cargo test -p tmuxx-cli --test interoperability invalid_buffer_names_are_rejected_with_safe_native_diagnostic_difference -- --ignored --exact"
review_when = "Every upstream paste-name validation or error-channel change; reconsider only with byte-preserving diagnostics that retain safe control framing."

[[differences]]
id = "buffer-load-size-bound"
profiles = ["command-control", "app-owned", "standalone", "unix-ipc"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["cmd-load-buffer.c", "file.c", "tmuxx/crates/tmuxx-runtime/src/lib.rs", "tmuxx/crates/tmuxx-runtime/src/unix_ipc.rs", "tmuxx/crates/tmuxx-runtime/src/scheduler.rs"]
reproducer = "Load a16MiB file, then load16MiB+1 from a file or stdin into an existing named buffer; submit a following command and reuse a control connection."
c_result = "Accepts both sizes and replaces the buffer."
rust_result = "Accepts16MiB; larger loads return an explicit transport/native input-size error without replacing the buffer or running later same-group commands. Excess Unix input is discarded through READ_DONE, preserving the connection and asynchronous command framing; the drain has a10-second deadline."
reason = "Bound one finite buffer upload while retaining ordinary C file protocol and recovery. READ_CANCEL cannot safely replace draining because C treats a cancellation racing EOF as an unknown stream and exits."
wire_invariants = "At and below the bound, binary bytes and notifications retain their C semantics. Rejection keeps C WAIT-success guards followed by a late unframed error, rather than inventing a new file message or corrupting the next stream. Existing buffers and the owner remain usable."
test = "cargo test -p tmuxx-cli --test interoperability load_buffer_limit_is_explicit_preserves_buffers_and_recovers_file_streams -- --ignored --exact"
review_when = "Review whenever finite-file transfer limits or C file cancellation semantics change; use streaming bounded storage before raising the cap."

[[differences]]
id = "native-job-delay-bound"
profiles = ["command-control", "app-owned", "standalone"]
