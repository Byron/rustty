test = "cargo test -p tmuxx-cli --test interoperability clap_driver_help_and_version_are_explicit_implementation_differences -- --ignored; cargo test -p tmuxx-cli --test socket_defaults clap_help_global_errors_and_excluded_modes_leave_no_server"
review_when = "Each upstream startup flag change; enable an excluded mode only with a native requirement and an executable behavior test."

