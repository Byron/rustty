reason = "Retain a finite nonnegative 24-hour host timer policy, with explicit rejection before creating a queued job. Normal C strtod spellings and invalid-string diagnostics remain compatible."
wire_invariants = "Ordinary command error framing is unchanged; no job or command side effect occurs on rejection."
test = "cargo test -p tmuxx-runtime --test scheduler native_job_delay_bound_is_an_explicit_c_difference -- --ignored"
review_when = "Each upstream delay parsing change or native scheduling-policy change."

[[differences]]
id = "native-special-file-policy"
profiles = ["command-control", "app-owned", "standalone", "native-views"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["file.c", "cmd-source-file.c", "tmuxx/crates/tmuxx-runtime/src/files.rs", "tmuxx/crates/tmuxx-runtime/src/scheduler.rs"]
reproducer = "Use a Unix FIFO/link/device or Windows named pipe, pipe symlink or console device as a native load-buffer/save-buffer/source-file path."
c_result = "C file transport may open special files and wait for peers or device I/O through its event loop."
rust_result = "Owner-side file operations explicitly reject special files other than Unix /dev/null or Windows NUL. Regular files and their symlinks keep bounded binary read/write behavior; null-device reads are empty and writes succeed. Windows checks device aliases and follows bounded final-component links before opening targets; source enumeration preserves literal device spelling and never opens a pipe symlink. Unix compatibility load/save clients retain their separate file transport; source-file paths use the owner policy for every client."
reason = "A FIFO or blocking device must not stop the native owner loop. Nonblocking open and validation before and after open preserve the file-type boundary without an asynchronous filesystem redesign."
wire_invariants = "The existing error and control framing is retained; rejection cannot replace buffers, start another process or change the live pane PID. The owner remains responsive after each rejected operation."
test = "cargo test -p tmuxx-runtime --test native_files special_native_files_reject_without_blocking_owner_or_changing_buffers -- --exact"
review_when = "Enable another native file type only with an explicit asynchronous I/O lifetime and cancellation contract."


[[differences]]
id = "windows-process-status-and-conpty-raw-output"
profiles = ["windows"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["cmd-pipe-pane.c", "window.c", "tmuxx/crates/tmuxx-runtime/src/process.rs", "tmuxx/crates/tmuxx-cli/tests/interoperability_windows.rs", "tmuxx/conformance/interop_process.py"]
reproducer = "Compare normal exit 137 and abrupt termination, respawn an output-piped pane, then drain a complete 256 KiB console burst into a slow sink while independently observing control output."
c_result = "POSIX exit 137 has status 137 and no signal; SIGKILL has signal 9 and no exit status. Raw PTY respawn output is READY and the burst is 262144 literal Z bytes."
rust_result = "Both Win32 normal exit 137 and TerminateProcess(137) have status 137 and no POSIX signal. ConPTY emits its real startup VT negotiation and console-output encoding; the pipe must match every byte independently received by the control viewer, retain exactly one READY marker and all 262144 emitted Z glyphs."
reason = "Win32 process status is not a POSIX wait status. ConPTY is a VT-producing console host rather than a transparent Unix PTY; its emitted bytes must not be stripped, fabricated or confused with the application write calls."
wire_invariants = "Actual pane/pipe identities, timestamps, metadata reset, before-EOF rendering, cancellation and original command continuations remain checked. No signal is inferred from a Windows numeric exit code and neither pipe nor control output is normalized."
test = "cargo +1.95.0 test --manifest-path Cargo.toml -p tmuxx-cli --test interoperability_windows -- --ignored --test-threads=1"
review_when = "Any ConPTY package, process-exit mapping, output forwarding or CLI input transport change."
