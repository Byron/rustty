[[differences]]
id = "native-server-diagnostics"
profiles = ["command-control", "standalone", "app-owned", "unix-ipc"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["cmd-show-messages.c", "server.c", "job.c", "tmuxx/crates/tmuxx-runtime/src/messages.rs"]
reproducer = "Run show-messages with no jobs, with a running shell job, after commands/errors, and after changing message-limit to0,2 or16385."
c_result = "C reports implementation-specific message text/timestamps and fd/pid job summaries; headless -T and empty -J are empty. It accepts message-limit16385."
rust_result = "Native diagnostics report escaped command and immediate-command-error records with Unix-second timestamps and live job IDs/kinds. -T is empty, optional missing client targets succeed, and message-limit controls newest-first retention. Both logs and job descriptions cap escaped payloads at4096 bytes with an explicit truncation marker; message-limit above16384 errors without changing the limit. Deferred completion errors remain on their ordinary response channel."
reason = "Useful native diagnostics describe the Rust owner and bound retained memory instead of fabricating C's process/event-loop internals."
wire_invariants = "show-messages keeps ordinary command output framing, existing flags, success/error channels and headless tty behavior. Diagnostic contents are implementation-specific, not pane data."
test = "cargo test -p tmuxx-cli --test interoperability server_diagnostics_expose_native_logs_jobs_limits_and_c_empty_tty_state -- --ignored"
review_when = "Each diagnostic or job ownership change; revisit limits if native support requires a larger retained log."

[[differences]]
