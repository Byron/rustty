[[differences]]
id = "clap-driver-help-and-excluded-modes"
profiles = ["command-control", "standalone", "unix-ipc"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["tmux.c", "tmuxx/crates/tmuxx-cli/src/main.rs", "tmuxx/crates/tmuxx-cli/src/lib.rs"]
reproducer = "Run -h, --help, -V, a missing -S argument, or excluded -l/-c/-v modes."
c_result = "C -h succeeds with compact getopt usage; --help is rejected. -V identifies tmux and its selected build. C implements login/shell replacement and diagnostic log files."
rust_result = "Clap -h/--help succeeds and -V identifies the tmuxx Cargo version. Invalid global arguments have clap diagnostics; -l/-c shell replacement and -v log files explicitly reject before starting a daemon."
reason = "Expose a useful clap driver with its own implementation identity; shell replacement, tty login and C log-file reproduction have no native pane effect. Command argument parsing, command diagnostics and exit status remain independently compared."
