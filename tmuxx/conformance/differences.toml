schema_version = 1

[[differences]]
id = "native-detached-job-drain"
profiles = ["command-control", "app-owned", "standalone", "windows"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["server.c", "job.c", "cmd-run-shell.c", "tmuxx/crates/tmuxx-runtime/src/lib.rs", "tmuxx/crates/tmuxx-runtime/src/scheduler.rs"]
reproducer = "Start a blocked run-shell -b job, enable exit-unattached and exit-empty, disconnect the last client, then release the job. Also execute a blocking foreground run-shell command."
c_result = "Background jobs carry JOB_NOWAIT: automatic server exit sends SIGTERM to the job process. Foreground commands retain a live server until completion. The C socket inode can remain after the server exits."
rust_result = "Automatic native owner exit waits for retained background jobs to finish, preserving their command effects; foreground commands also finish before exit. Explicit owner shutdown or owner death still terminates all owned jobs and descendants."
reason = "Native standalone ownership already promises retained running jobs. Preserving that behavior avoids discarding background command effects during automatic exit. This is a positive tested difference, not an exclusion."
wire_invariants = "Command ordering, foreground completion and wait-channel flushing remain covered. The corrected Unix fixture checks live socket connections; Windows evidence independently observes the C process through a retained pidfd and the native owner through its pipe."
test = "cargo +1.95.0 test --manifest-path Cargo.toml -p tmuxx-runtime --test windows_lifecycle -- --include-ignored --test-threads=1"
review_when = "When the native retained-job policy or C JOB_NOWAIT exit behavior changes. The historical macOS socket-existence assertion did not establish C liveness."

[[differences]]
id = "windows-unicode-glob-scalar-boundaries"
profiles = ["windows"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["format.c", "tmuxx/crates/tmuxx-format/src/windows_glob.rs", "tmuxx/crates/tmuxx-config/tests/c_reference.rs"]
reproducer = "Evaluate m:?,é, m:??,é, m:?,界, m:???,界 and ASCII controls with the pinned glibc C oracle and native Windows matcher."
c_result = "The glibc UTF-8 fnmatch implementation accepts both one scalar and its two/three UTF-8 byte count: ? and ?? match é; ? and ??? match 界. Exact native-versus-C observations and libc identity are retained."
rust_result = "Native Windows glob ? consumes exactly one Unicode scalar. ?? rejects é and ??? rejects 界; ASCII controls and one-scalar matches remain equal."
reason = "Keep the already-declared deterministic Windows Unicode glob contract instead of adding libc's byte fallback to scalar matching. This is implemented behavior with exact independent results, not an exclusion for missing matching support."
wire_invariants = "Remote C protocol results remain byte-exact and unmodified. The complete original format matrix still executes; only the explicitly identified multi-wildcard Unicode case asserts separate native and C outcomes. A dedicated eight-case executable witness remains required."
test = "cargo +1.95.0 test --manifest-path Cargo.toml --locked --offline -p tmuxx-config --test c_reference -- --ignored --test-threads=1"
review_when = "Every supported libc/Unicode or glob change; retire or revise when the pinned C oracle no longer exhibits the independently asserted fallback."

[[differences]]
id = "windows-job-shell-input-and-termination"
profiles = ["windows"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["job.c", "tmuxx/crates/tmuxx-runtime/src/scheduler.rs", "tmuxx/crates/tmuxx-runtime/tests/scheduler/windows.rs"]
reproducer = "Change default-shell, run a child that observes its actual parent executable and TERM/COLORTERM, inspect stdin type/read EOF, and abruptly terminate the child before a following command and successful job."
c_result = "The pinned Linux C reference executes /bin/sh with argv0 sh, exposes a socket on stdin with EOF, and reports SIGTERM as status143 with the exact terminated-by-signal diagnostic."
rust_result = "Native Windows jobs execute the verified system cmd.exe independently of the pane shell. Stdin is FILE_TYPE_PIPE with EOF. Abrupt child termination reports the actual Windows status -1 and returned-status diagnostic."
reason = "Expose actual Windows process and handle behavior rather than inventing POSIX sockets, signals or shell argv0. Native and C results are independently asserted while retaining all shared job command vectors."
wire_invariants = "Command/control framing, environment overrides, target context, foreground queue continuation and subsequent status reset remain covered. Both EOF paths close the owner write side; neither leaves a console or inherited writer."
test = "cargo +1.95.0 test --manifest-path Cargo.toml --locked --offline -p tmuxx-runtime --test scheduler -- --ignored --test-threads=1"
review_when = "Every Windows job launcher, inherited-handle or termination-status change, and every supported C shell execution change."

[[differences]]
id = "windows-account-pipes-and-explicit-ownership"
profiles = ["windows"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["server.c", "client.c", "tmuxx/crates/tmuxx-runtime/src/windows.rs", "tmuxx/crates/tmuxx-cli/src/windows.rs"]
reproducer = "Attach through a local named pipe or fixed --native-stdio bridge; select a missing instance, compete for a live name, or submit a mutation with an old incarnation."
c_result = "The Unix reference uses owner-private Unix sockets and UID identity; native Windows named pipes, SID access and ConPTY ownership have no C executable counterpart. C command clients retain their Unix startup policy."
rust_result = "Windows pipe ACLs and verified peer account SIDs permit desktop/SSH logons of the same account. Direct network pipes and other accounts are denied. Clients only attach; explicit -D startup creates owners. Missing, ambiguous, incompatible and replaced owners produce errors before command submission."
reason = "Use the Windows security and process model while preserving native command/control records and supported remote C protocol behavior. Discovery is not authentication."
wire_invariants = "No C tmux code is linked. C protocol clients keep byte-preserving remote records. Native selection uses additive Hello fields; it is never interpolated into shell commands. Failed attachment creates neither an owner nor a pane."
test = "cargo +1.95.0 test --manifest-path Cargo.toml -p tmuxx-cli --test windows -- --test-threads=1; python tmuxx/conformance/windows_ssh.py --help"
review_when = "Every endpoint authentication, bridge startup, discovery or native Hello version change. Required executable cross-logon and unauthorized-account evidence remains in the Windows profile."

[[differences]]
id = "windows-retained-root-process-metadata"
profiles = ["windows"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["osdep-darwin.c", "names.c", "tmuxx/crates/tmuxx-runtime/src/names.rs"]
reproducer = "Create a pane in a Unicode path, change its root process working directory, start a foreground child and query pane_current_command/pane_current_path."
c_result = "The Unix reference uses its OS foreground-process-group inspection to discover command/path metadata."
rust_result = "Windows retains the original process handle and reads its image/current directory. It does not recycle an exited PID into unrelated-process metadata and does not pretend the foreground child is the root. Unicode decoding failure yields absent metadata rather than an aliased name/path."
reason = "ConPTY exposes no foreground POSIX process-group query. The root process is a stable, real Windows identity with explicit limits."
wire_invariants = "Pane IDs and pane_pid remain the actual original process identity; terminal output, process ownership and remote C values are unchanged by this metadata policy."
test = "cargo +1.95.0 test --manifest-path Cargo.toml -p tmuxx-runtime --lib names::windows_tests::root_handle_metadata_tracks_native_cd_and_never_reuses_an_exited_pid -- --exact"
review_when = "When a documented Windows API provides foreground-process identity or the supported process-parameter ABI changes."

[[differences]]
id = "windows-unicode-pattern-locale-and-budgets"
profiles = ["windows"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["format.c", "tmuxx/crates/tmuxx-format/src/windows_regex.rs", "tmuxx/crates/tmuxx-format/src/windows_glob.rs", "tmuxx/vendor/posix-regex/WINDOWS.md"]
reproducer = "Match Unicode classes, ranges and equivalence classes; substitute captures and empty matches; exceed declared pattern/input/output/work budgets through direct and pane-content formats."
c_result = "Unix C uses its platform regex/fnmatch and active locale collation, with C tmux's byte-based substitution progression. Native Windows has no UCRT POSIX regex/fnmatch equivalent."
rust_result = "Windows uses the documented deterministic Unicode locale, scalar ranges and canonical-base equivalence classes. Captures preserve original bytes, including malformed UTF-8 and byte advancement after suppressed empty matches. Complexity/input/work/output limits return explicit expansion errors through the core dispatcher."
reason = "Provide actual native matching semantics without mutating the host GUI locale, silently aliasing names or reporting budget exhaustion as no match."
wire_invariants = "Only native Windows evaluation uses this locale; Unix libc behavior and remote C protocol data are preserved. Native algorithm expectations are not evidence of complete C-reference parity and do not exclude shared format obligations."
test = "cargo +1.95.0 test --manifest-path Cargo.toml --locked --offline -p tmuxx-format -p tmuxx-core --lib; cargo +1.95.0 test --manifest-path tmuxx/vendor/posix-regex/Cargo.toml --locked --offline"
review_when = "Every supported Rust/Unicode or C regex/fnmatch update; review locale outcomes and explicit budgets against the supported references."

[[differences]]
id = "native-selector-utf8-rejection"
profiles = ["command-control", "native-views", "app-owned", "standalone"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["cmd-find.c", "cmd-queue.c", "tmuxx/conformance/generate_command_metadata.py", "tmuxx/crates/tmuxx-command/src/registry.rs", "tmuxx/crates/tmuxx-runtime/src/scheduler.rs", "tmuxx/crates/tmuxx-core/src/lib.rs"]
reproducer = 'Create session replace<U+FFFD> with window window<U+FFFD>, then use literal 0xff in session/window/client -t, source -s or client -c selectors. Exercise ordinary argv and control octal \377 spelling, including kill-session, link/move/swap/join/break, display-message, switch/refresh-client and detach-client.'
c_result = "C compares selector bytes without Unicode replacement. Missing graph/client lookups report raw-byte diagnostics; CANFAIL display/detach selectors may succeed with absent/fallback context or no effect. Neither client rewrites these bytes when connected to C."
rust_result = "The native server rejects malformed effective selectors at command execution with command NAME: -FLAG target is not valid UTF-8. Ordinary native-endpoint CLI errors additionally retain the existing tmuxx: prefix. The graph and attachment survive, valid U+FFFD names still resolve, earlier commands execute, following commands in a failed group cancel, and unused branches do not reject."
reason = "The Rust graph and client names are UTF-8 strings. Reject malformed lookup bytes before lossy conversion can select or destroy a different object named with U+FFFD."
wire_invariants = "This rule applies only to server-executed selector roles derived from C metadata plus four explicit manually resolved destinations. Generic client validation and C forwarding remain byte-preserving. Effective last repeated flags retain C precedence; arbitrary argv, directory/path bytes, creation names, buffers/data and separators keep their existing independent rules. C/R status, output and control errors are asserted independently, without normalizing the difference."
test = "cargo test -p tmuxx-cli --test selectors -- --ignored --test-threads=1"
review_when = "Every upstream command registration/selector-role or target-resolution change. Retire the admission difference if native graph/client names acquire byte-exact storage and lookup."

[[differences]]
id = "control-independent-session-close-order"
profiles = ["command-control", "native-views"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["session.c", "control-notify.c", "tmuxx/crates/tmuxx-core/src/lib.rs"]
reproducer = "Create sessions b,a,c with one window each, add four detached windows to c, attach a control client to a, then submit kill-session -t c ; rename-window -t a:one survivor through one external command client."
c_result = "The non-output stream is sessions-changed, unlinked-window-close @3, @4, @5, @6, @2, then window-renamed @1 survivor. session_destroy repeatedly removes the root of the C winlink red-black tree."
rust_result = "The non-output stream is sessions-changed, unlinked-window-close @2, @3, @4, @5, @6, then window-renamed @1 survivor. Independent closes use increasing winlink order. All close payloads and the final session/window/pane graph agree."
reason = "Keep deterministic graph traversal without reproducing the historical shape of C's internal red-black tree."
wire_invariants = "Only independent closes within one destroyed session may differ in order. They cannot cross that session's sessions-changed record, subsequent command notifications or lifecycle dependency events. Exact C/R sequences are asserted separately, without sorting or normalizing the stream. Other notification routes retain exact-order tests."
test = "cargo test -p tmuxx-runtime --test client_commands independent_session_window_closes_keep_explicit_order_and_causal_boundaries -- --ignored"
review_when = "Every upstream session destruction, winlink traversal or event-ordering change; retire if C adopts deterministic winlink order."

[[differences]]
id = "native-raw-grid-storage"
profiles = ["command-control", "native-views"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["cmd-capture-pane.c", "grid.c", "input.c", "tmuxx/crates/tmuxx-terminal/src/capture_raw.rs"]
reproducer = "In a 20x6 pane print READY, an ACS q, a horizontal tab followed by X, and a truecolor Z followed by erase-line; inspect capture-pane -pR."
c_result = "ACS cell: data=(1,1,q), attr=CHARSET[80]. Tab cell: data=(8,8,        ), flags=TAB[80]. Partially cleared extended slot: flags=NONE[0]. An untouched row reports 0/0 allocated cells."
rust_result = "ACS cell contains the actual glyph: data=(1,3,─), attr=NONE[0]. A tab's expanded empty slot reports data=(1,1, ), flags=CLEARED[40]. The erased slot also reports CLEARED[40]. The untouched native row reports 0/20 because all twenty slots exist."
reason = "Expose actual native page slots and decoded cell contents instead of duplicating C's packed-cell allocation, source character-set bytes and compressed physical tab layout solely for debug output. Ordinary capture retains HT spelling as bounded semantic metadata."
wire_invariants = "G/L/C record grammar, global dimensions/history, real text/style/color/link/padding fields, OSC133 markers and raw-option precedence remain available. Shared cell fields have exact C assertions; these independent storage examples are compared separately without normalization. Plain capture and rendering have their own parity contracts."
test = "cargo test -p tmuxx-terminal --test raw_capture_reference -- --ignored --test-threads=1"
review_when = "Every upstream capture/grid encoding or native page representation change; this exception never permits changing ordinary visible content or terminal behavior."

[[differences]]
id = "native-tab-reflow-bounds"
profiles = ["command-control", "native-views"]
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"
sources = ["grid.c", "crates/rustty-vt/src/screen/tabs.rs", "crates/rustty-vt/src/screen/resize.rs"]
reproducer = "A 20x3 pane prints READY CRLF HT X CRLF, then resizes to8,6,20 columns. Separately erase two padding cells inside that tab before resizing20→10→20."
c_result = "At6 columns the tab head and seven padding slots split into different rows; X survives in a physical cell beyond the declared width and disappears from ordinary capture until widened. A fractured tab retains its original declared width, causing an extra wrap on narrowing."
rust_result = "Tabs wider than the destination or fractured by edits expand into ordinary visible spaces before reflow. Every physical row remains within the pane width, X remains in capture, and widening/snapshot restoration preserve all text. Intact tabs at ordinary widths retain exact C capture spelling and allocation behavior."
reason = "Keep native row bounds valid and avoid retaining hidden out-of-bounds cells solely to reproduce the C tab representation."
wire_invariants = "Capture framing and terminal commands remain unchanged; independent exact C/native outcomes are asserted. This is a deliberate terminal-state difference, not transcript normalization."
test = "cargo test -p tmuxx-terminal --test capture_reference native_reflow_expands_oversized_and_fractured_tabs_without_hidden_cells -- --ignored"
review_when = "Each upstream grid reflow update; retire if C expands oversized/fractured tabs without hidden cells."

