tests = ["join_and_break_preserve_pane_identity_and_nested_geometry", "full_window_splits_and_joins_use_proportional_geometry", "preset_layouts_cycles_spread_and_restore", "custom_layout_indexes_active_history_and_excess_cells", "floating_restore_geometry_and_modal_stacking", "legacy_layout_keeps_floats_and_swaps_transfer_cell_geometry", "creation_tiled_and_floating_split_flags", "floating_ownership_and_saved_geometry_follow_moves_and_swaps"]
