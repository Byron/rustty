# These run the Rust implementations on Windows. Only the explicitly pinned C
# oracle runs on a POSIX SSH host; this does not qualify native pane processes.
[[suites]]
id = "windows-stock-c-ssh-client"
kind = "remote-c-cargo"
platforms = ["win32"]
profiles = ["windows", "system-client", "command-control"]
reference_version = "tmux next-3.9"
remote_config_env = "TMUXX_REMOTE_C_CONFIG"
remote_fixtures = 1
raw_system_ssh = true
args = ["+1.95.0", "test", "--locked", "--offline", "-p", "tmuxx-client", "--test", "ssh_reference", "--", "--ignored", "--test-threads=1", "--nocapture"]
env = {}
timeout = 180

[[suites.assertions]]
id = "control.real-ssh-bootstrap-reconnect-indeterminate-loss"
tests = ["ssh_stock_tmux_discovery_bytes_reconnect_and_ambiguous_mutation"]
description = "The complete original SystemClient matrix runs natively over actual Windows SSH with a fixed restricted command. It discovers pinned C graph/captures, receives seven-byte fragmented live output, terminates SSH and reconnects to the same live PID, and reports an applied unobserved mutation as Indeterminate without replay. The oracle owns only the private C fixture; raw control bytes do not pass through its framed transport."

