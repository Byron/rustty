[[suites]]
id = "windows-remote-c-fixture-lifecycle"
kind = "remote-c-cargo"
platforms = ["win32"]
profiles = ["windows"]
reference_version = "tmux next-3.9"
remote_config_env = "TMUXX_REMOTE_C_CONFIG"
remote_fixtures = 2
args = ["+1.95.0", "test", "--locked", "--offline", "-p", "tmuxx-runtime", "--test", "remote_oracle", "--", "--ignored", "--test-threads=1", "--nocapture"]
env = {}
timeout = 180

[[suites.assertions]]
id = "conformance.remote-c-persistent-fixture-cleanup"
tests = ["persistent_controls_held_stdin_environment_and_pidfd_cleanup"]
description = "The actual native test validates the leased C oracle's held source-file stdin, concurrent command progress, byte-exact startup/request environments, persistent controls, shared fixture lifetime, PID-fd observation and complete descendant cleanup. This validates the C-reference infrastructure, not Windows pane ownership."

[[suites.assertions]]
id = "conformance.remote-c-implicit-startup-cleanup"
tests = ["implicit_configuration_starter_loss_releases_rejected_clients_and_waiters"]
description = "The original C implicit-start configuration barrier executes once after loss of its actual launching command client and a queued client. All 140 original malformed native-endian IPC handshakes release their slots; the surviving client sees final configuration and exact graph, then the subreaper reaps the daemon and every descendant."

[[suites]]
id = "windows-stock-c-ssh-native-views"
kind = "windows-system-c-views"
harness = "windows-external-json"
platforms = ["win32"]
profiles = ["windows", "system-client", "native-views"]
reference_version = "tmux next-3.9"
remote_config_env = "TMUXX_REMOTE_C_CONFIG"
remote_fixtures = 2
args = []
env = {}
timeout = 600

[[suites.assertions]]
id = "rustty.stock-c-ssh-native-views-and-reconnect"
tests = ["tmuxx::system::tests::stock_ssh_views_share_live_panes_and_survive_connection_restart", "windows_system_c_views::visible_shared_graph", "windows_system_c_views::gui_restart_preserves_remote_panes"]
description = "Native Windows executes the complete original stock SSH connection matrix, then the actual packaged Rustty GUI renders externally changed C sessions/windows/splits and duplicate/shared winlinks. A GUI restart preserves exact live C pane PIDs. Two pinned leased C fixtures require complete cleanup; both restricted SSH credential sets and the actual native executables are identified."

