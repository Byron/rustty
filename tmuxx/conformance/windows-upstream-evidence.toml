# Explicit native counterparts adapt raw-console and slow/failed pipe fixtures.
# Command output is never rewritten. See WINDOWS.md for every adaptation.

[[suites]]
id = "windows-upstream-harness-cleanup"
platforms = ["win32"]
profiles = ["windows"]
args = ["+1.95.0", "test", "--locked", "--offline", "-p", "tmuxx-cli", "--test", "upstream_regressions_windows", "harness_cleans_flooding_owners_after_script_exit_and_timeout", "--", "--ignored", "--exact", "--nocapture"]
env = {}
timeout = 120

[[suites.assertions]]
id = "harness.script-exit-timeout-and-detached-owner-cleanup"
tests = ["harness_cleans_flooding_owners_after_script_exit_and_timeout"]
description = "Native shell scripts leave real ConPTY cat/tr flood descendants after success, early failure and timeout. Explicit owners enter a separate fixture Job before the first pane command; cleanup kills each product owner and requires its complete Job process list to become empty before fixture-job rescue. All three cases observe live descendant PIDs and prove zero survivors while an unrelated native process remains alive. Production CLI workers also have kill-on-close ownership when their shell script is interrupted."

