description = "Pinned C scripts and native Windows counterparts retain every upstream assertion. Private explicit owners, native paths and documented console/pipe fixtures adapt platform setup; command output is never rewritten. Original C scripts run unchanged. Native run-shell/wait-exit scripts retain their assertions; native anonymous-pipe counterparts retain the full slow/unread-output assertions, detach and five post-detach marker checks, bounded fast drain and exact-owner exit. An infinite real ConPTY producer writes 512 bytes every 20 ms; a bounded real terminal-row check precedes attachment. Exact live client identity and unread pipe output immediately before the action prove the original client remains attached. The original three-second/512KiB drain must reach actual EOF with exactly one bare %exit as its final newline-terminated record, client exit code zero and stdin still held open."

