schema_version = 1
reference_revision = "22f34d3fa984e03719b0a1b2ac4677aaf61cd53d"

[platform_execution.darwin]
status = "active"
reason = "macOS implementation and executable conformance continue."

[platform_execution.linux]
status = "active"
reason = "Linux server execution is authorized. Exact GNU/Linux host evidence and a platform-specific owner watchdog are required; supported Rustty desktop client obligations remain required."

[platform_execution.win32]
status = "active"
reason = "Native Windows implementation and qualification are authorized; activation is not evidence of qualification."

# This is the requested scope, not a list derived from implemented commands.
# Unknown/new upstream commands, options, formats and regressions stay pending
# until their assertions have been reviewed and mapped; discovery never excludes.
[discovery]
regressions = "regress/*.sh"
commands = "cmd-*.c"
options = "options-table.c"
formats = "format.c"

[profiles.command-control]
description = "Unix CLI, configuration, commands, control replies and observable effects"
platforms = ["linux", "darwin"]

[profiles.system-client]
description = "Client of declared unmodified C tmux control versions"
platforms = ["linux", "darwin"]

[profiles.native-views]
description = "Shared engine state, native snapshots, view/input and layout reconciliation"
platforms = ["linux", "darwin"]

[profiles.standalone]
description = "Daemon-owned processes and output survive GUI/client restart"
platforms = ["linux", "darwin"]

[profiles.app-owned]
description = "Embedded host lifetime and local/remote views of the same processes"
platforms = ["linux", "darwin"]

[profiles.unix-ipc]
description = "C and Rust command/control clients using declared imsg schema/ABIs"
platforms = ["linux", "darwin"]

[profiles.windows]
description = "ConPTY, desktop/SSH named-pipe access and application ownership"
platforms = ["win32"]
execution = "active"
includes = ["command-control", "system-client", "native-views", "standalone", "app-owned"]
reason = "Require fresh native Windows evidence for the shared command, protocol, terminal, view and lifetime contracts and all four Windows obligations."

[applicability.unix-imsg]
platforms = ["darwin", "linux"]
assertions = ["ipc.four-command-control-pairings", "ipc.ordinary-tty-rejection-before-mutation", "ipc.identify-order-version-and-descriptor-rejection", "control.c-3.7c-command-control-pairings"]
rationale = "These exact assertions exercise local C/Rust AF_UNIX imsg pairings, SCM_RIGHTS descriptor admission or ordinary tty identify rejection. The Windows product has no local C/Unix-imsg ABI; its account-private named-pipe and native stdio assertions remain required separately. Both supported real C SSH control versions and all shared command, protocol and terminal effects remain required. This prevents mixed suite profile labels from importing Unix-only transport obligations and preserves every original macOS proof member."

[[exclusions]]
id = "ordinary-tty-renderer"
reason = "Ordinary ANSI terminal presentation is outside the requested product. Shared terminal state/input assertions remain required."
assertions = ["tty.status-border-redraw", "tty.interactive-attach-presentation", "tty.chooser-presentation"]

[[assertions]]
id = "graph.create-split-rename"
profiles = ["command-control", "native-views"]
scenario = "graph"
description = "Create a named session, split and create windows; compare IDs, links, pane indices and rename effects."
sources = ["session.c", "window.c", "cmd-new-session.c", "cmd-split-window.c", "cmd-rename-window.c"]

[[assertions]]
id = "format.lookup-and-operators"
profiles = ["command-control"]
scenario = "format"
description = "Exact bytes for supplied fields, nested conditions, comparisons, aliases and user-option lookups."
sources = ["format.c", "regress/format-strings.sh", "regress/format-modifiers.sh"]

[[assertions]]
id = "terminal.capture-basic"
profiles = ["command-control", "native-views"]
scenario = "capture"
description = "Real PTY application output including SGR produces exact capture-pane output."
sources = ["input.c", "cmd-capture-pane.c", "regress/input-sgr.sh"]

[[assertions]]
id = "input.literal-roundtrip"
profiles = ["command-control", "native-views"]
scenario = "input"
description = "send-keys literal input reaches a raw child and returns through the same pane."
sources = ["cmd-send-keys.c", "input-keys.c"]

