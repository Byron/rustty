# Reviewed 2026-10-19 against the pinned C sources and the named executable tests.
# Proofs close only these statements; neighboring broad obligations remain open.
[[coverage]]
obligation = "scope:native-ui-policy:1"
assertions = ["native.ui-command-rejection-state-and-queue"]
rationale = "The test requires exact equality with the source-audited native-ui command inventory, supplies nested mutating actions, and compares every retained graph/PID/screen/buffer/option observation after each explicit rejection. Dispatch rejects these canonical commands before any implementation effect; independent literal input proves the child and queue remain usable."

[[coverage]]
obligation = "scope:native-ui-policy:2"
assertions = ["native.ui-command-rejection-state-and-queue", "native.control-popup-rejection-and-reply"]
rationale = "The exhaustive native command policy covers nested popup/menu/prompt actions, and a separate attached control client exercises popup rejection followed by the next correlated reply with all retained state unchanged. There is no server-owned UI mode lifetime to retain in this explicitly unsupported profile."

[[coverage]]
obligation = "scope:native-ui-policy:3"
assertions = ["native.ui-command-rejection-state-and-queue", "terminal.c-osc133-retained-markers-and-output", "terminal.osc133-snapshot-boundaries-and-validation"]
rationale = "Dependent send-keys -X/-K and presentation-only flags are explicitly rejected with no state/input mutation. The retained terminal backend separately implements native search, output selection and extraction through reflow, history eviction and snapshot restore; rejecting tmux mode entry does not erase that data."

[[coverage]]
obligation = "native-ui.command-effects-or-explicit-difference"
assertions = ["native.ui-command-rejection-state-and-queue", "native.control-popup-rejection-and-reply"]
rationale = "Every command in the declared native UI surface has the same reviewed explicit unsupported policy, verified against a real owner and live child. Attached control popup rejection also leaves the following command reply intact; command metadata remains available independently."

[[coverage]]
obligation = "scope:child-input:2"
assertions = ["input.c-key-mode-modifier-and-backspace-bytes", "native.ui-command-rejection-state-and-queue"]
rationale = "The C byte oracle covers both prefix and prefix2 through send-prefix and send-prefix -2 across application and extended-key modes, including disabled and aliased key settings. send-keys -K is rejected before child input or native key-table mutation. General named/mouse/focus routing remains a separate obligation."

[[coverage]]
obligation = "scope:options-types:2"
assertions = ["options.unsupported-settings-preserve-defaults"]
rationale = "The test derives every available unsupported option from the same generated C metadata as the setter and confirms explicit rejection plus unchanged default collections. The shared unsupported branch returns before storage for all values and unset/append paths, so an inert accepted setting cannot satisfy this policy."

[[coverage]]
obligation = "scope:presentation-option-policy:1"
assertions = ["options.unsupported-settings-preserve-defaults"]
rationale = "All options in the presentation-only list are outside the writable native-effect allowlist. The metadata-driven test covers each of them and verifies rejection without storage; native pane styles and host theme are scoped separately and are not excluded as presentation."

[[coverage]]
obligation = "scope:presentation-option-policy:2"
assertions = ["options.unsupported-settings-preserve-defaults", "options.c-all-generated-defaults-and-query-metadata", "options.c-scope-arrays-validation-quoting"]
rationale = "The complete image-enabled C default/query inventory covers presentation defaults and inherited absence. Unsupported setters retain the shared argument, option-name, scope, array and type/range validation before reporting the native-profile error, verified by the scalar/array C tests and nonmutation test. This closes the presentation policy, not every supported option behavior."

[[coverage]]
obligation = "scope:format-evaluation:3"
assertions = ["format.c-styled-width-trim-and-escaping"]
rationale = "The exact C expression matrix covers style markers and malformed styles, escaped hash runs and aliases, both trim directions, raw padding, combining/wide text and controls. The implementation shares the reviewed style scanner for measured width and trims while preserving C's different raw-padding rule; graph/process/terminal field callbacks stay under their separate observable-state obligation."

[[coverage]]
obligation = "scope:pane-layout:2"
assertions = ["graph.c-pane-border-status-outer-rows", "graph.c-format-identity-order-and-zoom-geometry", "runtime.pane-move-pid-and-pty-size"]
rationale = "C geometry tests cover top/bottom/off border footprints for outer tiled rows and floating panes, plus hidden panes during zoom and actual window resize. The runtime test changes border status around the same live child and checks its OS PTY size against engine dimensions, preserving PID. Native painting therefore does not bypass the command geometry or process resize contract."

[[coverage]]
obligation = "scope:native-view-effects:2"
assertions = ["terminal.c-osc133-retained-markers-and-output", "terminal.osc133-snapshot-boundaries-and-validation"]
rationale = "The current-C retained-marker fixture checks marker positions/flags/status, history eviction and repeated reflow. It restores the same backend used by Rustty, locates output with native search, selects it through Screen::select_output and compares extracted text with C copy-output/copy-selection bytes. Every parser split and malformed marker snapshot is checked separately. Server UI mode entry remains a distinct policy."

[[coverage]]
obligation = "scope:native-view-effects:3"
assertions = ["native.styles-snapshot-and-host-theme", "native.pane-style-theme-and-reconnect", "native.reported-color-query-only-snapshot-and-reconnect"]
rationale = "Core style tests establish active/inactive pane colors and reported-versus-forced theme semantics; native runtime tests change active panes and host color reports, reconnect, and retain color defaults, underlying application overrides and process identity. Both pieces of this statement remain typed native-visible state."

[[coverage]]
obligation = "scope:format-absent-context:1"
assertions = ["format.c-absent-ui-tty-and-selected-client-contexts", "native.ui-command-rejection-state-and-queue"]
rationale = "The C comparison derives every field from the declared absent-context scope and queries no-client, actual control-client, selected-client, graph-list and context-free command-list contexts. Static buffer/client/tree templates are compared byte for byte. The native policy rejects all tmux widget creation before mutation, so these callbacks cannot mask a retained server-owned UI mode."

[[coverage]]
obligation = "scope:format-absent-context:2"
assertions = ["format.c-absent-ui-tty-and-selected-client-contexts", "native.client-cell-dimensions-theme-context"]
rationale = "Control-client dimensions and theme retain the exact C context rules while native views expose actual grid and cell dimensions and supplied host theme. The real-child test compares OS PTY dimensions and emitted terminal query replies across two-client arbitration, and reconnect checks retain the host theme. Native-only values are supplied by the typed view state rather than inventing a physical tty."

[[coverage]]
obligation = "scope:configuration:1"
assertions = ["parser.byte-grammar-and-quoting", "parser.source-expansion-and-errors", "parser.c-text-and-argv", "config.directive-language", "config.prepare-before-execute", "config.c-source-registration-and-error-framing", "config.c-source-stdin-files-flags-and-async-preparation", "command.c-block-versus-string-preparation", "config.relative-include-hidden-job-environment", "config.c-tilde-accounts-home-fallback-and-aliases", "difference.parser-high-bytes", "difference.parser-malformed-source", "difference.native-special-file-policy"]
rationale = "Text/argv grammar and quoting are compared independently; configuration tests exercise bare/hidden assignments, inactive and nested branches, prepare-before-execute, aliases, relative includes and exact line/group diagnostics. Named-account expansion adds source-boundary cases. Explicit high-byte/malformed-source differences require both sides' outcomes rather than changing expected C bytes."

[[coverage]]
obligation = "scope:configuration:2"
assertions = ["config.c-startup-once-killed-clients-and-early-rejection", "command.background-branches-after-disconnect", "config.nested-include-and-error-order"]
rationale = "The executable lifetime test kills the starter and its replacement while startup is blocked, requires the following replacement to wait, and verifies single-load and late-source effects. More than the admission cap of malformed identified clients must close during the blocked configuration, exercising callback lifetime before completion. Separate scheduler tests cover late job completion and disconnected waiters without reviving freed clients."

[[coverage]]
obligation = "config.includes-and-errors"
assertions = ["config.nested-include-and-error-order", "config.relative-include-hidden-job-environment", "config.c-source-registration-and-error-framing", "config.c-source-stdin-files-flags-and-async-preparation", "config.c-tilde-accounts-home-fallback-and-aliases", "difference.native-special-file-policy"]
rationale = "Nested relative source files execute in source order with preserved source/target context; registration, dry-run, skipped branches, glob flags, verbose line errors and outer-group continuation have exact C comparisons. Named-user/home fallback and alias paths are included."

[[coverage]]
obligation = "scope:child-input:1"
assertions = ["input.c-key-mode-modifier-and-backspace-bytes", "input.c-native-pointer-focus-and-paste-bytes", "rustty.native-input-focus-host-effects-and-process-replacement", "options.environment-and-behavior-effects", "input.literal-roundtrip"]
rationale = "The byte oracle crosses named/control/extended keys and modifiers with application modes, while54 exact C observations cover mouse tracking/encoding, focus and bracketed paste. Actual Rustty Session tests deliver keys/paste/text to synchronized live children using each child's modes, keep mouse/reply input local, aggregate focus across views and gate it with the server option. Literal PTY roundtrip and synchronized option tests connect the command/native entry points to the same reviewed encoder."

[[coverage]]
obligation = "lifetime.persist-ack-gui-restart"
assertions = ["lifetime.killed-client-retention-links-detached-query", "lifetime.native-pane-retention-after-all-views-drop"]
rationale = "The production native bridge receives successful retain acknowledgements before SIGKILL. The owner remains alive with no GUI clients; a new bridge process observes the same retained child PID and output. The separate two-view test checks retention acknowledgement and ephemeral-pane cleanup after all views leave."

[[coverage]]
obligation = "lifetime.detach-output-and-queries"
assertions = ["lifetime.killed-client-retention-links-detached-query"]
rationale = "With every native client process gone, a retained raw child emits detached text and CSI6n, records the exact one reply and polls for duplicates. A newly launched native bridge recovers the text and original PID. The owner is the sole application-query writer through this entire no-view interval."

[[coverage]]
obligation = "lifetime.partial-pane-retention-and-links"
assertions = ["lifetime.killed-client-retention-links-detached-query", "lifetime.native-pane-retention-after-all-views-drop"]
rationale = "The killed-client fixture retains one acknowledged pane in a window shared by two sessions, removes an ephemeral sibling, preserves both exact winlinks and the original PID, and restores that pane through the linked session. The multi-view test checks that cleanup waits for the last view."

[[coverage]]
obligation = "lifetime.stale-endpoint-new-incarnation"
assertions = ["lifetime.reused-endpoint-new-incarnation", "rustty.new-incarnation-invalidates-stale-views", "runtime.native-endpoint-identity-and-version"]
rationale = "A real killed owner is restarted at the same endpoint with reused pane ID and a new instance. Actual Rustty rejects stale view identity even when pane/PID values are reused and sequence decreases, resets host-event routing and isolates previous selection/output. Endpoint inode/version tests separately prevent stale path cleanup or incompatible negotiation from affecting the replacement owner."

[[coverage]]
obligation = "native.two-views-independent-selection"
assertions = ["rustty.shared-native-backend-and-independent-views", "rustty.restored-native-search-and-shell-selection", "rustty.native-session-window-and-pane-mapping"]
rationale = "Actual Rustty attaches multiple Session views to one shared pane through embedded and socket connections. Output and row/image identity stay shared while selection/search remain local; workspace tests extend this to shared windows and duplicate winlinks with distinct native views and exact command targets."

[[coverage]]
obligation = "native.rustty-render-search-adapter"
assertions = ["rustty.shared-native-backend-and-independent-views", "rustty.restored-native-search-and-shell-selection", "rustty.native-session-window-and-pane-mapping", "rustty.floating-composition-and-hit-testing", "rustty.modal-key-and-outside-click-owner-routing", "rustty.sixel-owner-creation-order", "rustty.hidden-native-metal-frame", "rustty.retained-agent-state-and-native-view-replay"]
rationale = "The fingerprinted workspace executes the actual Session restore/search/selection path, workspace mapping, renderer placement ordering and desktop hit/modal routing. A freshly built hidden desktop emits a verified native Metal frame with tiled/floating panes. These assertions verify integration of the retained backend; they do not replace the separate terminal-data/image parity obligations."

[[coverage]]
