[[coverage]]
obligation = "windows.named-pipe-acl-desktop-ssh"
assertions = ["windows.pipe-fragmentation-identity-and-bounds", "windows.real-unauthorized-and-network-denial", "windows.real-desktop-local-pipe-ssh-shared-graph", "windows.real-rustty-ssh-view-and-helper-lifetime", "windows.live-protocol-fragments-eof-and-incarnations", "windows.real-rustty-command-ssh-view-and-helper-lifetime"]
rationale = "Require real account-token and local-only pipe checks, actual distinct-account denial, same-account desktop/OpenSSH access across logon sessions, shared live graph/PIDs, and stale/replacement identity behavior. Discovery names alone earn no authentication evidence."

[[coverage]]
obligation = "windows.bridge-no-duplicate-server"
assertions = ["windows.live-native-bridge-shared-panes", "windows.live-protocol-fragments-eof-and-incarnations", "windows.real-ssh-bridge-shells-and-disconnect", "windows.real-desktop-local-pipe-ssh-shared-graph", "windows.real-rustty-ssh-view-and-helper-lifetime", "windows.desktop-external-shared-duplicate-links", "windows.desktop-standalone-retained-restart", "windows.rustty-tmux-dispatch-no-implicit-owner", "windows.rustty-driver-retained-process-and-views", "rustty.native-ssh-command-protocol-selection", "rustty.native-ssh-command-config-preservation", "windows.desktop-persistent-owner-and-missing-attachment", "windows.real-rustty-command-ssh-view-and-helper-lifetime", "windows.rustty-concurrent-persistent-bootstrap"]
rationale = "Local binary stdio and real cmd/PowerShell OpenSSH bridges must select an existing desktop/standalone owner, preserve pane identity and shared/duplicate links, reject missing or replaced instances, and leave jobs alive across bridge/GUI restarts."

[[coverage]]
obligation = "windows.conpty-runtime-packaging"
assertions = ["windows.conpty-resource-hashes-and-negative-initialization", "windows.owner-rejects-missing-incompatible-runtime", "windows.shipped-gui-and-owner-resource-negatives", "windows.conpty-synchronized-output-cursor-order", "windows.atomic-spawn-job-ownership"]
rationale = "Require the shared initializer's exact pinned resource hashes, both real shipped executables and negative resource cases, actual bundled ConPTY redraw/cursor results, and atomic process ownership. Compilation or an in-box runtime cannot satisfy this proof."

[[coverage]]
obligation = "windows.input-resize-descendant-lifetime"
assertions = ["windows.native-hwnd-keyboard-mouse-resize", "windows.native-clipboard-paste-and-fixture-cleanup", "windows.real-ime-preedit-commit-and-restoration", "windows.native-osc52-host-effect-and-query-once", "windows.atomic-spawn-job-ownership", "windows.desktop-app-owner-cleanup", "windows.desktop-standalone-retained-restart", "windows.conpty-synchronized-output-cursor-order", "windows.real-rustty-ssh-view-and-helper-lifetime", "windows.rustty-driver-retained-process-and-views", "windows.desktop-persistent-owner-and-missing-attachment", "windows.real-rustty-command-ssh-view-and-helper-lifetime", "windows.rustty-concurrent-persistent-bootstrap"]
rationale = "Require real native HWND keyboard/mouse/resize and bracketed paste, actual TSF preedit/commit into the original pane, elected native clipboard write/read with exactly-once pane replies and reconnect behavior, bundled ConPTY cursor ordering, atomic spawn-time ownership, both graceful and abrupt app-owner descendant cleanup with an unrelated survivor, and retained standalone GUI restart plus SSH-viewer lifetime. An IME capability probe, backend encoder, compile, or fixture cleanup alone cannot satisfy these complete executable members."

