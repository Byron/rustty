env = {}

[[suites.assertions]]
id = "terminal.native-history-allocation-accounting"
tests = ["native_history_allocation_metrics_account_for_page_capacity"]
description = "Allocated native row/cell slots bound live rows/cells, byte components sum to the page-owned total, and auxiliary arena count equals page count through writes, collection and snapshot restore. An invalid restored scroll position is rejected."

[[suites]]
id = "terminal-history-allocation-difference"
