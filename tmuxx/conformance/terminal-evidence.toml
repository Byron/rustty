env = { TMUXX_C_TMUX = "$reference" }

[[suites.assertions]]
id = "terminal.native-history-allocation-difference"
tests = ["native_history_allocation_metrics_are_explicit_c_difference"]
description = "Records independent C/native byte totals and six-field allocation diagnostics for an empty screen, ASCII rows, and a styled combining character; checks the C byte sum and proves the documented native allocator difference without normalizing it."

