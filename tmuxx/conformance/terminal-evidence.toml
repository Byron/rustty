# Executable evidence for Rustty VT integration and layout contracts.
# These assertions alone do not establish C tmux terminal parity.

[[suites]]
id = "terminal-history-head-reference"
platforms = ["darwin", "linux"]
profiles = ["native-views", "command-control"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-core", "--test", "history_reference", "head_history_counters_match_c_and_survive_snapshots", "--", "--ignored", "--exact"]
env = { TMUXX_C_TMUX = "$reference" }

[[suites.assertions]]
id = "terminal.c-history-counters-and-resize"
tests = ["head_history_counters_match_c_and_survive_snapshots"]
description = "HEAD C compares primary history size, limit, added/collected/generation counters, cursor and captured rows at every step with limits 0/1/3/20, 10-percent collection, partial scroll regions, live limit updates, enabled/disabled history resize, RIS/ED3 and alternate screen. Native snapshots retain counters and resize scroll position."

[[suites]]
id = "terminal-history-supported-reference"
platforms = ["darwin", "linux"]
profiles = ["native-views", "command-control"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-core", "--test", "history_reference", "history_limits_resets_and_regions_match_supported_c", "--", "--ignored", "--exact"]
env = { TMUXX_C_TMUX = "$reference" }

[[suites.assertions]]
id = "terminal.c-history-limits-and-resets"
tests = ["history_limits_resets_and_regions_match_supported_c"]
description = "The shared HEAD/3.7c history row/cursor/limit contract runs the same exact step matrix without HEAD-only counter formats."

[[suites]]
