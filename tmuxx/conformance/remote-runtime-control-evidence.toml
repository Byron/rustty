# Complete runtime matrices execute native Windows Rust owners and pinned remote C references.

[[suites]]
id = "windows-remote-c-pty-ownership"
kind = "remote-c-cargo"
platforms = ["win32"]
profiles = ["windows"]
reference_version = "tmux next-3.9"
remote_config_env = "TMUXX_REMOTE_C_CONFIG"
remote_fixtures = 2
args = ["+1.95.0", "test", "--locked", "--offline", "-p", "tmuxx-runtime", "--test", "host", "pty_descendant_cleanup_difference_matches_c", "--", "--ignored", "--exact", "--nocapture"]
env = {}
timeout = 120

[[suites.assertions]]
id = "runtime.c-pty-ownership-boundary"
tests = ["pty_descendant_cleanup_difference_matches_c"]
description = "Real C setpgid and setsid descendants ignore SIGHUP and survive leader/server exit. Native CREATE_NEW_PROCESS_GROUP and DETACHED_PROCESS descendants independently verify console attachment and survive leader exit, then both die with their owning Job. Process handles and remote pidfds avoid PID reuse; a separately owned process remains alive and every reference descendant is reaped by its private lease."

[[suites]]
id = "windows-control-pipe-eof"
platforms = ["win32"]
profiles = ["windows"]
args = ["+1.95.0", "test", "--locked", "--offline", "-p", "tmuxx-cli", "--test", "windows_eof", "--", "--test-threads=1"]
env = {}

[[suites.assertions]]
id = "control.silent-fifo-eof-and-descriptor-flags"
tests = ["silent_pipe_eof_and_cancel_close_control_input_without_changing_shared_handle_state"]
description = "A real native -C client remains attached while its stdin pipe writer is silent. Writer EOF and explicit detach with the writer still open both release the client within five seconds; the duplicated pipe retains its original blocking mode and handle flags. Exactly one exit follows queued immediate output/completed guards; a waited late job cannot revive output or kill the owner. Every case retains the live pane PID. The original Unix suite separately checks FIFO poll and shared fcntl flags."

[[suites]]
id = "windows-remote-c-runtime-identity"
kind = "remote-c-cargo"
platforms = ["win32"]
profiles = ["windows"]
reference_version = "tmux next-3.9"
remote_config_env = "TMUXX_REMOTE_C_CONFIG"
remote_fixtures = 1
args = ["+1.95.0", "test", "--locked", "--offline", "-p", "tmuxx-runtime", "--test", "identity", "--", "--ignored", "--test-threads=1", "--nocapture"]
