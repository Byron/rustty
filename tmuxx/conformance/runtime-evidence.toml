[[suites.assertions]]
id = "difference.native-special-file-policy"
tests = ["special_native_files_reject_without_blocking_owner_or_changing_buffers"]
description = "Native load/save/source reject Unix FIFOs or Windows named pipes, symlinks to those endpoints and non-null devices before mutation; each rejection leaves buffers/PID intact and the owner responds. Regular files and regular-file symlinks retain binary bytes. Unix /dev/null and Windows NUL (including admitted absolute spellings) retain no-op behavior; Windows reserved-device aliases are rejected and source enumeration never opens a pipe symlink."

