[[suites.assertions]]
id = "format.c-authenticated-client-identity-and-lists"
tests = ["authenticated_client_identity_and_graph_lists_match_c"]
description = "Identical Rust control identities against C/R servers preserve peer UID/user rather than forged environment, PID/TERM/features, insertion/name/time/size client lists and filters, single/multiple session and group attachments, live/dead previous sessions and exact server socket/PID relations."

[[suites.assertions]]
id = "format.c-absent-ui-tty-and-selected-client-contexts"
tests = ["authenticated_client_identity_and_graph_lists_match_c"]
description = "Every field enumerated by the absent-context scope is queried without an attached client and through real control clients. Static widget templates retain C bytes; tty-only dimensions remain absent for control clients. Display best-client selection, explicit -c, list contexts and context-free list-commands match C."

[[suites.assertions]]
id = "format.c-control-tty-counters"
tests = ["authenticated_client_identity_and_graph_lists_match_c"]
description = "C client_written/client_discarded are absent without a client and zero for attached control clients even after live PTY output and command replies: they count tty rendering bytes, not control transport traffic. window_bigger likewise observes actual control tty offset state (zero) and is absent without a format client."

[[suites]]
id = "native-stream-consistency"
platforms = ["darwin", "linux", "win32"]
profiles = ["app-owned", "standalone", "native-views"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-runtime", "--test", "native_stream_consistency", "--", "--test-threads=1"]
env = {}

[[suites.assertions]]
id = "native.atomic-live-snapshot-update-cut"
tests = ["live_native_snapshot_has_one_cut_and_updates_follow_its_end"]
description = "A real native Unix socket or Windows pipe stops after its first image snapshot chunk while the live owner changes output, alternate screen, size and window name. The old snapshot installs only at its end, newer output is delivered exactly once afterward, and the next complete snapshot has the new graph/screen state and a newer sequence."

[[suites.assertions]]
id = "native.blocked-view-overflow-and-reconnect"
tests = ["blocked_native_view_disconnects_while_healthy_view_and_pty_survive"]
description = "A real PTY emits 20MiB while one native view stops reading. Only the blocked 256-record view disconnects; the healthy view receives every byte with increasing sequences. Reconnect returns the same live PID and current screen."

[[suites]]
id = "native-byte-backlog"
platforms = ["darwin", "linux", "win32"]
profiles = ["app-owned", "standalone", "native-views"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-runtime", "--lib", "snapshots::native_byte_backlog_disconnects_before_record_capacity", "--", "--exact"]
env = {}

[[suites.assertions]]
id = "native.backlog-byte-cap"
tests = ["snapshots::native_byte_backlog_disconnects_before_record_capacity"]
description = "With record capacity raised to 1024, 32768-byte pane output crosses the independent 64MiB delivery charge exactly at the first over-budget record. The slow client is removed, snapshot bookkeeping is cleared, and the healthy client receives every record while the owner keeps advancing."

[[suites]]
id = "client-command-flags-c-reference"
platforms = ["darwin", "linux"]
profiles = ["command-control", "unix-ipc", "native-views"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-runtime", "--test", "client_commands", "--", "--ignored", "--test-threads=1"]
env = { TMUXX_C_TMUX = "$reference" }

[[suites.assertions]]
id = "clients.c-targets-navigation-cwd-and-zoom"
tests = ["attach_switch_targets_navigation_and_zoom_match_c"]
description = "Real C/R control clients compare named/colon client targets, next/previous/last sessions, sort modes, readonly toggles, format-expanded attach cwd, window/pane selection and zoom retention. External command clients target other attached clients with matching errors."

[[suites.assertions]]
id = "clients.c-detach-selection-and-ipc-acknowledgement"
tests = ["detach_targets_all_session_and_attach_displacement_match_c_ipc"]
description = "Detach a named client, all other clients or a session, attach -d/-x and new-session -AD/-AX: real identified clients receive exact DETACH/DETACHKILL payloads and complete EXITING/EXITED. The remaining client and sessions remain usable."

[[suites.assertions]]
id = "clients.c-session-notification-routing"
tests = ["client_session_notifications_are_targeted_like_c"]
description = "Full non-output event streams after self-switch, targeted other-client switch, attach and detach match C through reply barriers. The changed client alone receives session-changed; peers receive client-session-changed and the final client-detached record."

[[suites.assertions]]
id = "clients.c-window-and-config-notification-routing"
tests = ["window_and_config_notifications_follow_each_client_session_like_c"]
description = "Full non-output streams for two C/R clients compare create/link/rename/unlink/close, active pane creation/removal and split/zoom records, recipient flags and unzoom-before-destruction. A batched create-through-kill transaction preserves each event's original graph and legacy/new-layouts payload. Source config-error targets only its origin after the reply; an application-originated legacy OSC rename preserves linked/unlinked recipient routing."

[[suites.assertions]]
id = "clients.c-grouped-notification-order-and-multiplicity"
tests = ["grouped_sessions_preserve_complete_notification_order_like_c"]
description = "Three grouped sessions and duplicate winlinks compare every non-output C/R notification in order through group creation, transient initial windows, rebuilding, selection, unlink, swap, kill, final-link group destruction, move from a final-link session and rename."

[[suites.assertions]]
id = "clients.c-pane-movement-and-zoom-notification-order"
tests = ["pane_moves_and_zoom_preserve_complete_notification_order_like_c"]
description = "Two subscribed clients compare every non-output record through active splits, rotate/swap, hidden-pane and retained-zoom selection, kill, cross/same-window join/move and last-pane break with rename. A shared window makes legacy and new-layouts records independently observable, including emission-time active indices and unzoom-before-removal."

[[suites.assertions]]
id = "control.c-direct-prepared-blocks-and-environment"
tests = ["direct_control_preserves_prepared_blocks_environment_and_aliases_like_c"]
description = "Strict complete event streams compare each command guard, output boundary, flags and notification through explicit barriers. Cases cover direct brace/environment/alias preparation, delayed if/run-shell, background -C delivery, hook flags0, source groups and preparation errors, synchronous source cancellation, deferred raw job output and buffer events. Guard timestamps and server-global number gaps vary, but monotonic begin numbers and exact matching close identity are checked before comparison. Native batch completion remains separate."

[[suites.assertions]]
id = "difference.control-independent-session-close-order"
tests = ["independent_session_window_closes_keep_explicit_order_and_causal_boundaries"]
description = "C's exact five-window RB-root removal sequence and Rust's exact deterministic winlink sequence are asserted independently. Both contain the same close records after sessions-changed and before a following rename in the same external queue; final session/window/pane graphs agree. No event sorting or cross-boundary normalization is applied."

[[suites.assertions]]
id = "clients.c-automatic-window-sizing-and-caps"
tests = ["automatic_resize_uses_linked_clients_and_window_caps_like_c"]
description = "resize-window -a/-A and combined flags choose smallest/largest linked-client dimensions, respect per-window caps and ignore-size, and set manual sizing with matching pane dimensions."

