[[suites.assertions]]
id = "runtime.owner-private-sockets-and-lock-paths"
tests = ["native_and_ipc_endpoints_are_owner_private_and_lock_symlinks_are_rejected"]
description = "Unix endpoint types have owner mode0600 and private locks. Windows inspects the actual pipe owner and protected single-account DACL, rejects a second owner, removes discovery on shutdown and assigns a new incarnation on replacement. Both perform a real handshake and preserve an unrelated target behind rejected filesystem/lock redirection; Windows explicitly rejects Unix IPC configuration. Cross-account and cross-logon admission has separate executable obligations."

[[suites]]
