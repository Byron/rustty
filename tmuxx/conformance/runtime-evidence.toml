# These are specific lifetime contracts; OS-daemonized new sessions require a
# different containment mechanism and are not certified by PTY session cleanup.
[[suites]]
id = "runtime-native-ui-policy"
platforms = ["darwin", "linux", "win32"]
profiles = ["command-control", "native-views"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-runtime", "--test", "native_policy", "--", "--test-threads=1"]
env = {}

[[suites.assertions]]
id = "native.ui-command-rejection-state-and-queue"
tests = ["every_scoped_native_ui_command_rejects_without_state_or_input_mutation"]
description = "Every native UI command listed in scope.json, nested action arguments and dependent injection/presentation flags reject explicitly; graph/process IDs, terminal input, buffers and options remain unchanged and the queue remains live."

[[suites.assertions]]
id = "native.control-popup-rejection-and-reply"
tests = ["control_popup_rejection_preserves_pane_and_next_guarded_reply"]
description = "An attached control client receives explicit popup rejection, then the next correlated command reply; retained pane/process IDs, buffers, screen and options remain unchanged."

[[suites]]
id = "runtime-tilde-c-reference"
platforms = ["darwin", "linux"]
profiles = ["command-control"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-runtime", "--test", "scheduler", "named_user_tilde", "--", "--ignored", "--test-threads=1"]
env = { TMUXX_C_TMUX = "$reference" }

[[suites.assertions]]
id = "config.c-tilde-accounts-home-fallback-and-aliases"
tests = ["named_user_tilde_and_empty_home_fallback_match_c"]
description = "C/R output agrees for named-account homes, empty/missing/configured HOME, quoted/concatenated words, preparation assignments and aliases; unknown and excessive usernames retain exact source error bytes and status."

[[suites]]
id = "runtime-host-lifetimes"
platforms = ["darwin", "linux", "win32"]
profiles = ["app-owned", "standalone", "unix-ipc"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-runtime", "--test", "host"]
env = {}

[[suites.assertions]]
id = "runtime.pty-session-descendant-cleanup"
tests = ["shutdown_terminates_pty_descendants_after_the_leader_exits"]
description = "After the PTY leader exits, shutdown reclaims its background descendant while an independent host retains the same live PID. Unix checks a same-session process group ignoring SIGHUP; Windows checks an owned Job Object process group ignoring console control signals through an exact process handle."

[[suites.assertions]]
id = "runtime.socket-client-admission-and-close"
tests = ["socket_clients_are_bounded_and_shutdown_closes_idle_peers"]
description = "At most 128 simultaneous socket clients, including identification, obtain worker slots; close releases a slot and owner shutdown closes idle peers."

[[suites.assertions]]
id = "runtime.native-endpoint-identity-and-version"
tests = ["refuses_to_replace_existing_endpoint", "cleanup_does_not_remove_a_replacement_endpoint", "stale_owned_socket_is_recovered_but_regular_files_are_preserved", "second_endpoint_failure_removes_only_owned_bindings", "native_handshake_rejects_mismatched_versions_before_requests"]
description = "Unix lifetime locks and inode checks protect live/replaced paths and recover stale sockets selectively. Windows checks named-pipe kernel-handle lifetime, replacement-owner survival after old peers close, and preservation of rejected regular-file endpoints. Both preserve an existing owner after failed multi-endpoint setup and reject wrong versions before mutation."

[[suites.assertions]]
id = "runtime.native-snapshot-stream-and-recoverable-cap"
tests = ["native_socket_streams_snapshots_and_cap_rejection_keeps_the_process"]
description = "Negotiated real Unix sockets or Windows named pipes stream an atomic graph; a sixteen-byte server cap returns an explicit abort while the original PTY PID survives, and normal-budget reconnect retains that PID."

[[suites]]
id = "native-snapshot-owner-bounds"
platforms = ["darwin", "linux", "win32"]
profiles = ["app-owned", "standalone", "native-views"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-runtime", "--lib", "snapshots::"]
env = {}

[[suites.assertions]]
id = "runtime.snapshot-large-message-and-image-restore"
tests = ["snapshots::one_large_snapshot_does_not_consume_the_slow_output_budget", "snapshots::image_snapshots_stream_atomically_and_rejection_preserves_the_live_owner"]
description = "A65MiB immutable snapshot does not trip the64MiB live-output queue; complete image data survives atomic multi-chunk restore, repeated requests coalesce, small image/snapshot caps fail explicitly without modifying the owner, and a larger-budget retry succeeds."

[[suites]]
id = "native-snapshot-framing"
platforms = ["darwin", "linux", "win32"]
profiles = ["app-owned", "standalone", "native-views"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-protocol", "--features", "native", "native::snapshot::tests"]
env = {}

[[suites.assertions]]
id = "protocol.snapshot-atomicity-offsets-and-truncation"
tests = ["native::snapshot::tests::streaming_is_atomic_bounded_and_recoverable"]
description = "Snapshot fragments stay below512KiB per wire record; only a validated end publishes state. Invalid offsets, declared oversize, truncation and recoverable aborts cannot install partial state."

[[suites]]
id = "layout-legacy-floating-wire"
platforms = ["darwin", "linux", "win32"]
profiles = ["system-client", "native-views"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-layout", "--lib", "c37_floating_suffix_keeps_signed_geometry_and_z_without_duplicate_ids"]
env = {}

[[suites.assertions]]
id = "layout.c37-floating-suffix"
tests = ["tests::c37_floating_suffix_keeps_signed_geometry_and_z_without_duplicate_ids"]
description = "Exact C3.7c layout_dump wire examples (git tag 3.7c layout-custom.c): signed coordinates, suffix stacking order, duplicated float identities, mixed and all-floating roots; malformed suffixes fail explicitly."


[[suites]]
id = "runtime-pty-ownership-reference"
platforms = ["darwin", "linux"]
profiles = ["app-owned", "standalone"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-runtime", "--test", "host", "pty_descendant_cleanup_difference_matches_c", "--", "--ignored", "--exact"]
env = { TMUXX_C_TMUX = "$reference" }

[[suites.assertions]]
id = "runtime.c-pty-ownership-boundary"
tests = ["pty_descendant_cleanup_difference_matches_c"]
description = "Both C references leave ignored-SIGHUP background-group and setsid descendants alive; Rust deliberately kills the former and retains the shared setsid ownership boundary, cleaning all experiment children afterward."

[[suites]]
id = "runtime-process-names-c-reference"
platforms = ["darwin", "linux"]
profiles = ["command-control", "standalone", "app-owned"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-runtime", "--test", "process_names", "--", "--ignored", "--test-threads=1"]
env = { TMUXX_C_TMUX = "$reference" }

[[suites.assertions]]
id = "runtime.c-foreground-command-path-and-automatic-name"
tests = ["foreground_path_and_automatic_names_follow_real_processes"]
description = "OS foreground command/cwd and automatic-rename format follow real children, fire window-renamed hooks and stop automatic renaming after an explicit name. pane_tty equals the child's actual tty path, while pane_start_path remains the original directory after foreground cwd changes."

[[suites]]
id = "runtime-session-lifecycle-c-reference"
platforms = ["darwin", "linux"]
profiles = ["command-control", "standalone", "app-owned"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-runtime", "--test", "lifecycle", "--", "--ignored", "--test-threads=1"]
env = { TMUXX_C_TMUX = "$reference" }

[[suites.assertions]]
id = "runtime.c-session-destruction-and-client-fallback"
tests = ["destroyed_sessions_move_or_detach_attached_clients_by_policy", "self_destruction_wraps_session_order_and_respects_no_detach_fallback", "destroy_unattached_respects_group_keep_policies"]
description = "Current C/Rust owners agree on detach-on-destroy policies, session-name wraparound, no-detach client overrides, current-client session destruction, session-changed hook fields and destroy-unattached grouped keep policies."

[[suites.assertions]]
id = "runtime.c-exit-unattached-flush-and-job-drain"
tests = ["exit_unattached_flushes_channels_locks_and_event_waiters", "exit_unattached_waits_for_background_jobs_before_terminating"]
description = "exit-empty off overrides exit-unattached; enabling exit releases waiting channels, lock contenders and event waiters, while connected clients and active background jobs keep the owner alive until drained."

[[suites.assertions]]
id = "format.c-activity-sorting-and-timestamp-relations"
tests = ["activity_sorting_and_timestamp_relations_follow_attach_and_output"]
description = "S/W/L activity sorting, reverse and sort-flag precedence match C across attachment and real application output; creation/activity/last-attach/start-time fields satisfy the same relations without comparing unrelated clock samples."

[[suites.assertions]]
id = "runtime.c-alert-hooks-and-silence-timers"
tests = ["alert_hooks_clear_on_selection_repeat_bells_and_reset_silence"]
description = "C and Rust owners agree on alert payloads, repeated bells versus suppressed repeated activity, attached-current clearing, action suppression and silence deadline reset/disable with live timers."

[[suites.assertions]]
id = "runtime.c-shell-event-snapshot-payloads"
tests = ["shell_marker_hooks_have_c_pane_payloads"]
description = "OSC133 prompt/start/end in one input chunk preserve C event order, pane/session/winlink fields and each marker's command-line/status/duration snapshot."

[[suites]]
id = "runtime-format-jobs-c-reference"
platforms = ["darwin", "linux"]
profiles = ["command-control", "standalone", "app-owned"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-runtime", "--test", "format_jobs", "--", "--ignored", "--test-threads=1"]
env = { TMUXX_C_TMUX = "$reference" }

[[suites.assertions]]
id = "format.c-asynchronous-jobs-stream-cache-and-expansion"
tests = ["asynchronous_format_jobs_stream_cache_expand_and_restart_like_c", "repeated_format_jobs_share_live_work_and_report_not_ready", "format_jobs_stop_with_the_requesting_client"]
description = "Persistent C/Rust clients observe immediate empty results, last-complete-line updates, final partial output, cached expansion, changed-command restart, suppressed nested/output jobs, stderr/status policy, one shared live job per command, delayed-output placeholders and real process termination when the requesting client detaches."

[[suites]]
id = "core-format-job-effects"
platforms = ["darwin", "linux", "win32"]
profiles = ["command-control", "app-owned", "standalone"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-core", "--lib", "format_jobs::tests::"]
env = {}

[[suites.assertions]]
id = "format.job-effect-ownership-cache-bound-and-stale-results"
tests = ["format_jobs::tests::job_effects_are_scoped_cancel_stale_results_and_bound_the_cache"]
description = "The core emits explicit job requests only when enabled, keeps results scoped to clients, ignores stale callbacks after client loss, suppresses nested jobs and bounds cached commands."

[[suites]]
id = "runtime-identity-c-reference"
platforms = ["darwin", "linux"]
profiles = ["command-control", "unix-ipc"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-runtime", "--test", "identity", "--", "--ignored", "--test-threads=1"]
