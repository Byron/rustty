[[suites.assertions]]
id = "buffers.name-validation-and-empty-noop"
tests = ["buffer_creation_cleans_names_once_and_lookup_remains_raw", "invalid_buffer_names_reject_without_mutation_and_diagnostics_are_line_safe", "empty_buffer_input_and_pending_capture_do_not_allocate_or_notify"]
description = "Shared raw-byte buffer creation validates before mutation, escapes accepted TAB/NL/backslash names once, preserves raw lookup/append behavior without malformed-UTF8/U+FFFD collisions, keeps same-name rename unchanged, rejects invalid UTF8/control names with line-safe diagnostics, and leaves empty payload/capture buffers, notifications, effects and automatic IDs untouched."
