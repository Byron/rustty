# Original scripts are run in place with TEST_TMUX, SHELL=/bin/sh, isolated
# sockets and a timeout. No script/command/output rewrite is applied.
[[suites]]
id = "upstream-harness-cleanup"
platforms = ["darwin", "linux"]
profiles = ["command-control", "unix-ipc", "standalone", "app-owned"]
args = ["test", "--locked", "--offline", "-p", "tmuxx-cli", "--test", "upstream_regressions", "harness_cleans_flooding_owners_after_script_exit_and_timeout", "--", "--ignored", "--exact"]
env = {}

[[suites.assertions]]
id = "harness.script-exit-timeout-and-detached-owner-cleanup"
tests = ["harness_cleans_flooding_owners_after_script_exit_and_timeout"]
description = "Synthetic scripts leave a real Rust pane flooding after success, early failure and timeout/unwind. The harness reserves the unreaped script identity; Linux additionally cleans its private session's nested process groups and reparented SIGHUP-ignoring descendants through pidfds. Owner/pane/cat/tr and nested helpers must exit while an independent daemon remains queryable. A detached unresponsive socket owner verifies bounded/reaped shutdown clients and kernel-peer/start-identity kill fallback; native socket entries are excluded."

