remote_config_env = "TMUXX_REMOTE_C_CONFIG"
remote_fixtures = 3
args = ["+1.95.0", "test", "--locked", "--offline", "-p", "tmuxx-terminal", "--test", "images_reference", "--", "--ignored", "--test-threads=1", "--nocapture"]
env = {}
timeout = 300

[[suites.assertions]]
id = "terminal.c-kitty-query-upload-placement-and-chunking"
tests = ["kitty_upload_query_chunking_and_placement_match_c"]
description = "Requires a separately built C oracle with image_support=1; selected Kitty upload/query/chunk/placement/PNG/zlib/failure replies, invalid source crop and unsupported deletion-selector/layer/number errors, silent successful deletion, cursor/title/text agree at chunk sizes1/7/all. A nonimage C reference fails explicitly."

[[suites.assertions]]
id = "difference.graphics-rustty-image-number-and-layer-extensions"
tests = ["kitty_image_numbers_and_nonzero_layers_are_explicit_rustty_extensions"]
description = "Exact explicit difference: current image-enabled C returns ENOTSUP for image-number/nonzero-z uploads; Rust accepts and retains one native image. This does not grant C parity."

[[suites.assertions]]
id = "terminal.c-per-image-size-limits"
tests = ["per_image_encoded_accumulated_decoded_and_placement_limits_match_c"]
description = "Seven boundary fixtures compare C replies for encoded chunks, accumulated decoded bytes, and placement geometry under image-size-limit."

[[suites]]
id = "windows-remote-c-graphics-pixels"
kind = "remote-c-cargo"
platforms = ["win32"]
profiles = ["windows"]
reference_version = "tmux next-3.9"
remote_config_env = "TMUXX_REMOTE_C_CONFIG"
remote_fixtures = 7
remote_observers = ["image_pixels", "image_pixels", "image_pixels", "image_pixels", "image_pixels", "image_pixels", "image_pixels"]
args = ["+1.95.0", "test", "--locked", "--offline", "-p", "tmuxx-terminal", "--test", "images_pixels_reference", "--", "--include-ignored", "--test-threads=1", "--nocapture"]
env = {}
timeout = 300

[[suites.assertions]]
id = "terminal.c-image-retained-pixels-and-lifecycle"
tests = ["kitty_retained_pixels_clipping_alternate_and_respawn_match_c_redraw", "kitty_cross_screen_replacement_matches_c_redraw"]
description = "C graphical PTY SIXEL redraws compare every opaque retained pixel and clipped position (RGB tolerance3 for SIXEL quantization) through narrowing/growing, named placement movement, alternate-screen switching/replacement, and pane respawn. Each Rust step also restores a checkpoint."

[[suites.assertions]]
id = "terminal.c-image-anchor-reflow"
tests = ["kitty_image_anchor_reflow_between_wrapped_text_matches_c_redraw"]
description = "An image between wrapped text follows C history/reflow through repeated16-to8-to16 column changes; compare actual rendered pixels and restored anchors."

[[suites.assertions]]
id = "terminal.c-kitty-crops-offsets-and-deletion-pixels"
tests = ["kitty_source_crops_offsets_and_deletion_match_c_pixels"]
description = "C redraw pixels compare source rectangles/clipping, cell pixel offsets/clamping and one-axis scaling; named/image/all deletion retains SIXEL, ignores missing IDs and preserves saved-primary placements after alternate-screen deletion. Every step restores identical native pixels."

[[suites.assertions]]
id = "terminal.snapshot-row-identities-and-settings"
tests = ["snapshot_keeps_image_row_anchors_after_reflow", "snapshot_keeps_terminal_options_and_rejects_invalid_widths"]
description = "Stable row IDs and image anchors survive native restore after reflow; terminal policies/Unicode widths survive, and malformed width ranges are rejected."

