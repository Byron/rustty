# These suites execute the actual integrated sibling checkout. Its pinned base,
# integration result hashes, and all crate sources enter the evidence identity.
[[suites]]
id = "rustty-system-discovery-recovery"
platforms = ["darwin", "linux", "win32"]
kind = "rustty-cargo"
profiles = ["native-views", "system-client"]
args = ["+1.95.0", "test", "--locked", "--offline", "-p", "rustty", "--features", "sessions", "--lib", "tmuxx::system::tests::discovery_recovery_coalesces_structural_churn_once_with_a_fixed_deadline", "--", "--exact"]
timeout = 600
env = {}

[[suites.assertions]]
id = "rustty.system-discovery-coalescing-and-deadline"
tests = ["tmuxx::system::tests::discovery_recovery_coalesces_structural_churn_once_with_a_fixed_deadline"]
description = "Rustty coalesces structural discovery deferral on the same SSH actor until 150ms of structural quiet, permits one explicit read-only bootstrap recovery, and retains a fixed five-second deadline that continued events cannot extend. Actual external graph-burst reconciliation is exercised by the Windows system-C GUI suite."

[[suites]]
id = "rustty-native-adapter"
platforms = ["darwin", "linux", "win32"]
kind = "rustty-cargo"
profiles = ["native-views", "app-owned", "standalone"]
args = ["+1.95.0", "test", "--locked", "--offline", "-p", "rustty", "--features", "sessions", "--lib", "tmuxx::tests::", "--", "--test-threads=1"]
timeout = 600
env = {}

[[suites.assertions]]
id = "rustty.shared-native-backend-and-independent-views"
tests = ["tmuxx::tests::embedded_and_socket_views_share_panes_but_keep_selection_local", "tmuxx::tests::native_snapshot_preserves_row_ids_and_image_anchors_after_resize", "tmuxx::tests::streamed_snapshot_restores_large_image_atomically_and_abort_keeps_live_view", "tmuxx::tests::native_snapshot_restores_capture_lengths_after_non_reflow_shrink", "tmuxx::tests::native_snapshot_restores_stale_capture_rows_after_reflow", "tmuxx::tests::native_snapshot_rejects_invalid_capture_metadata_after_compatibility"]
description = "Actual Rustty embeds and restores the shared terminal backend through embedded/socket views, preserving independent selection, stable rows and image anchors, atomic large image snapshots and bounded abort recovery. Legacy owners with resized capture lengths or stale unknown capture rows reconnect through narrow metadata normalization; malformed tuples, invalid integer values, duplicate IDs, invalid allocations and known-cache orphan rows remain rejected."

[[suites.assertions]]
id = "rustty.restored-native-search-and-shell-selection"
tests = ["tmuxx::tests::restored_native_views_search_and_select_shell_output_independently"]
description = "Actual Rustty Session views restore wrapped/history OSC133 state; TerminalSearch finds retained output, native output selection returns exact command output and newline bytes, and a second view retains independent search/selection."

[[suites.assertions]]
id = "rustty.native-input-focus-host-effects-and-process-replacement"
tests = ["tmuxx::tests::native_typed_keys_and_paste_follow_each_pane_modes_without_broadcasting_mouse", "tmuxx::tests::native_focus_is_aggregated_across_views_and_connections_and_gated_by_server_option", "tmuxx::tests::native_host_actions_are_assigned_once_and_clipboard_replies_use_event_ids", "tmuxx::tests::native_exit_and_respawn_replace_process_state_and_selection"]
description = "Actual Session APIs route typed keys/paste/mouse, aggregate focus, assign clipboard and host actions once, and replace exited/respawned process state without stale selection."

[[suites.assertions]]
id = "rustty.new-incarnation-invalidates-stale-views"
tests = ["tmuxx::tests::new_server_incarnation_closes_stale_views_and_resets_event_identity"]
description = "A new server identity with reused pane/PID and lower sequence closes old views, isolates their selection/output, and resets host-event identity for fresh views."

[[suites.assertions]]
id = "rustty.native-view-wide-cells-viewports-sync-and-cursor"
tests = ["tmuxx::tests::native_views_preserve_wide_cells_viewports_sync_modes_and_stationary_cursor_changes"]
description = "Actual native Session snapshots preserve whole wide cells and independent history viewports through live updates and owner snapshots; stationary cursor hide/show changes advance the visible state, DEC2026 survives snapshot replacement, and overwriting a wide spacer repairs both cells."

[[suites.assertions]]
id = "rustty.native-detach-closes-views"
tests = ["tmuxx::tests::native_detach_closes_views_without_signalling_the_gui_parent"]
description = "Both native detach variants close every attached view and mark the transport closed without reporting a GUI error or signalling the GUI parent."

[[suites.assertions]]
id = "rustty.retained-agent-state-and-native-view-replay"
tests = ["tmuxx::tests::retained_agent_snapshot_seeds_views_once_without_replaying_host_effects", "tmuxx::tests::retained_agent_observes_fragmented_output_without_views_and_respawn_resets_generation", "tmuxx::tests::invalid_retained_agent_snapshot_keeps_the_published_view_and_report", "tmuxx::tests::slow_native_view_retains_latest_agent_report_when_effect_queue_is_full", "tmuxx::tests::retained_agent_native_reattachment_keeps_the_process_and_exit_clears_the_report"]
description = "Actual Rustty restores retained agent reports once, continues observing fragmented output without views, retains the latest report through full effect queues, rejects invalid snapshots atomically, resets generations on respawn, and reconnects to the same real process without replaying host effects."

[[suites.assertions]]
id = "rustty.native-ssh-command-protocol-selection"
tests = ["tmuxx::tests::native_ssh_command_keeps_trusted_shell_text_separate_from_protocol_selection"]
description = "An explicit trusted SSH shell command remains one remote exec argument while instance selection stays in the binary native protocol; cloning the connection for resizing and reconnect preserves the command."

[[suites.assertions]]
id = "rustty.native-mutation-timeout-no-replay"
tests = ["tmuxx::tests::timed_out_native_mutation_completes_once_and_keeps_reply_routing_separate"]
description = "A real owner executes a queued mutation exactly once after its acknowledgement times out. Releasing the stalled command preserves FIFO observation, separates unrelated asynchronous errors from routed replies, and lets a later mutation continue without replaying the ambiguous request."

