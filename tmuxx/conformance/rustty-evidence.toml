[[suites.assertions]]
id = "lifetime.reused-endpoint-new-incarnation"
tests = ["reused_endpoint_and_pane_id_have_a_new_server_incarnation"]
description = "Killing and restarting the owner at the same native endpoint reuses pane0 with a new process and a new server incarnation identity."

