[[suites]]
id = "windows-process-native-stdin"
platforms = ["win32"]
profiles = ["windows"]
args = ["+1.95.0", "test", "--locked", "--offline", "-p", "tmuxx-cli", "--test", "interoperability_windows", "native_cli_streams_input_before_eof", "--", "--ignored", "--exact", "--test-threads=1"]
env = {}
timeout = 60

[[suites.assertions]]
id = "process.native-stdin-socket"
tests = ["native_cli_streams_input_before_eof"]
description = "Actual native Windows pipe transport supplies acknowledged bounded stdin and EOF while a second CLI observes terminal changes before command completion. No C executable is required."
